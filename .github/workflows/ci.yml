name: CI

# Se déclenche sur toute PR et sur push vers dev. Le passage par main est
# couvert via workflow_call : publish-docker.yml appelle ce workflow au lieu
# de dupliquer ses jobs, donc pas de trigger push:main ici (double run sinon,
# une fois directement et une fois via cet appel).
on:
  pull_request:
  push:
    branches: [dev]
  workflow_call:

# Jeton en lecture seule : aucun job de ce workflow n'a besoin d'écrire.
permissions:
  contents: read

# Actions épinglées par SHA de commit (un tag peut être déplacé) ; le
# commentaire indique la version, que Dependabot tient à jour.
jobs:
  backend:
    # Aucun job de ce workflow ne dépend de GraphHopper. La suite Playwright,
    # elle, nécessite une instance GraphHopper avec la France entière importée
    # (4,7 Go de PBF, 5 à 60 min d'import, cf. README) — irréaliste dans ce
    # runner : elle reste une vérification locale avant de merger.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Installation des dépendances (versions et hashes du lock)
        run: |
          pip install --require-hashes --no-deps -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Suite pytest backend
        run: python -m pytest -q

      - name: requirements.lock à jour avec requirements.txt
        # uv reprend les versions déjà figées dans le fichier de sortie : seul
        # un changement de requirements.txt modifie le résultat.
        run: |
          cp requirements.lock "$RUNNER_TEMP/requirements.lock"
          pipx run uv==0.12.13 pip compile requirements.txt --generate-hashes \
            --python-version 3.12 --python-platform x86_64-manylinux_2_28 --no-header --quiet \
            -o "$RUNNER_TEMP/requirements.lock"
          diff -u requirements.lock "$RUNNER_TEMP/requirements.lock" \
            || { echo "::error::requirements.lock n'est plus synchronisé avec requirements.txt (voir README, Tests > Backend)"; exit 1; }

      - name: Audit des dépendances Python (vulnérabilités connues)
        run: pipx run pip-audit==2.10.1 --disable-pip --require-hashes -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances (lockfile exact)
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Audit des dépendances de production (vulnérabilités connues)
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    # Construit les deux images sans les publier, puis les analyse : garde-fou
    # avant merge pour la catégorie de bug déjà rencontrée une fois (vite
    # manquant, détecté seulement après le merge sur main car aucun job ne
    # construisait les images à l'époque de la PR).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build de l'image backend (sans push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: circuit-forgery-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build de l'image graphhopper (sans push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./graphhopper
          file: graphhopper/Dockerfile
          load: true
          tags: circuit-forgery-graphhopper:ci
          cache-from: type=gha,scope=graphhopper
          cache-to: type=gha,mode=max,scope=graphhopper

      - name: Le backend s'exécute sans privilèges root
        run: test "$(docker run --rm circuit-forgery-backend:ci id -u)" = "1000"

      - name: Analyse Trivy de l'image backend (bloquante)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: circuit-forgery-backend:ci
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Analyse Trivy de l'image graphhopper (informative)
        # Les vulnérabilités restantes proviennent des bibliothèques Java
        # embarquées dans le jar GraphHopper lui-même : seule une nouvelle
        # version de GraphHopper peut les corriger (11.0 est la dernière
        # publiée), d'où une analyse qui signale sans bloquer.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: circuit-forgery-graphhopper:ci
          scanners: vuln
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "0"
          skip-setup-trivy: true
