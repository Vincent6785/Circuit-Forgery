name: CI

# Se déclenche sur toute PR et sur push vers dev. Le passage par main est
# couvert via workflow_call : publish-docker.yml appelle ce workflow au lieu
# de dupliquer ses jobs, donc pas de trigger push:main ici (double run sinon,
# une fois directement et une fois via cet appel).
on:
  pull_request:
  push:
    branches: [dev]
  workflow_call:

jobs:
  test:
    # Lint + pytest, aucun des deux ne dépend de GraphHopper. La suite
    # Playwright, elle, nécessite une instance GraphHopper avec la France
    # entière importée (4,7 Go de PBF, 5 à 60 min d'import, cf. README) —
    # irréaliste dans ce runner. Reste une vérification locale avant de
    # merger, comme pratiqué jusqu'ici.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Suite pytest backend
        run: |
          cd backend
          docker run --rm -v "$PWD":/app -w /app python:3.12-slim \
            bash -c "pip install -q -r requirements-dev.txt && python -m pytest -q"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint frontend
        run: |
          cd frontend
          npm install
          npm run lint

  docker-build:
    # Construit les deux images sans les publier : garde-fou avant merge
    # pour la catégorie de bug déjà rencontrée une fois (vite manquant,
    # détecté seulement après le merge sur main car aucun job ne construisait
    # les images à l'époque de la PR).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build l'image backend (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false

      - name: Build l'image graphhopper (sans push)
        uses: docker/build-push-action@v6
        with:
          context: ./graphhopper
          push: false
