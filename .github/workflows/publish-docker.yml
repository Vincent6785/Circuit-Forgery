name: Publish Docker images

# Se déclenche à chaque mise à jour de main (en pratique, à chaque merge de
# PR — les pushs directs sont bloqués par la protection de branche) ; le
# déclenchement manuel permet de valider le pipeline sans dépendre d'un
# vrai merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Garde-fou avant publication : lint + pytest, aucun des deux ne dépend
    # de GraphHopper. La suite Playwright, elle, nécessite une instance
    # GraphHopper avec la France entière importée (4,7 Go de PBF, 5 à 60 min
    # d'import, cf. README) — irréaliste dans ce runner. Reste une
    # vérification locale avant de merger, comme pratiqué jusqu'ici.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Suite pytest backend
        run: |
          cd backend
          docker run --rm -v "$PWD":/app -w /app python:3.12-slim \
            bash -c "pip install -q -r requirements-dev.txt && python -m pytest -q"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint frontend
        run: |
          cd frontend
          npm install
          npm run lint

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Noms en minuscules codés en dur (contrainte GHCR, github.repository
      # contient des majuscules ici) plutôt que dérivés dynamiquement.
      - name: Build et push l'image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/vincent6785/circuit-forgery-backend:latest
            ghcr.io/vincent6785/circuit-forgery-backend:${{ github.sha }}

      - name: Build et push l'image graphhopper
        uses: docker/build-push-action@v6
        with:
          context: ./graphhopper
          push: true
          tags: |
            ghcr.io/vincent6785/circuit-forgery-graphhopper:latest
            ghcr.io/vincent6785/circuit-forgery-graphhopper:${{ github.sha }}
