name: Publish Docker images

# Se déclenche à chaque mise à jour de main (en pratique, à chaque merge de
# PR — les pushs directs sont bloqués par la protection de branche) ; le
# déclenchement manuel permet de valider le pipeline sans dépendre d'un
# vrai merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    # Garde-fou avant publication : réutilise ci.yml (lint, pytest, build à
    # blanc des deux images) plutôt que de dupliquer ses jobs — un run de
    # plus ici est redondant avec celui de la PR qui a mené à ce merge, mais
    # garde une dernière vérification sur l'état réel de main.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Noms en minuscules codés en dur (contrainte GHCR, github.repository
      # contient des majuscules ici) plutôt que dérivés dynamiquement.
      - name: Build et push l'image backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/vincent6785/circuit-forgery-backend:latest
            ghcr.io/vincent6785/circuit-forgery-backend:${{ github.sha }}

      - name: Build et push l'image graphhopper
        uses: docker/build-push-action@v6
        with:
          context: ./graphhopper
          push: true
          tags: |
            ghcr.io/vincent6785/circuit-forgery-graphhopper:latest
            ghcr.io/vincent6785/circuit-forgery-graphhopper:${{ github.sha }}
