# Override pour exécuter la suite Playwright contre la stack locale : le
# frontend est construit avec les accès internes utilisés par les tests
# (window.__map…), absents des images de production.
#
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
#   cd frontend && npm run test:e2e
services:
  backend:
    build:
      args:
        VITE_E2E_HOOKS: "true"
