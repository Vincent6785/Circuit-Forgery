# Rotation des journaux : le pilote json-file par défaut les laisse sinon grossir
# indéfiniment sur une machine qui tourne en continu.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  graphhopper:
    build: ./graphhopper
    environment:
      # Ajuster -Xmx selon la RAM disponible sur la machine (8-16g recommandé pour la
      # France entière, même valeur par défaut que graphhopper/Dockerfile).
      # -XX:+ExitOnOutOfMemoryError : une JVM à court de mémoire s'arrête (puis redémarre
      # via restart:) au lieu de rester à moitié fonctionnelle.
      - JAVA_OPTS=-Xmx16g -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./graphhopper/config.yml:/config/config.yml:ro
      - ./graphhopper/custom_models:/config/custom_models:ro
      - ./data/osm:/data:ro
      - graph-cache:/graph-cache
    logging: *default-logging
    ports:
      # Loopback uniquement (debug local) : le backend joint GraphHopper via le réseau
      # docker-compose interne (nom de service "graphhopper"), pas via ce port publié.
      - "127.0.0.1:8989:8989"
    restart: unless-stopped
    healthcheck:
      # Port admin Dropwizard (8990, interne au conteneur uniquement) : expose un
      # health check nommé "graphhopper" reflétant la disponibilité réelle du graphe
      # chargé (vérifié empiriquement contre l'instance réelle, pas juste "process up").
      # curl est déjà installé dans l'image (cf. graphhopper/Dockerfile).
      test: ["CMD", "curl", "-f", "http://localhost:8990/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Généreux : un import France entière à froid peut prendre 5-60 min selon la
      # machine (cf. README). Les échecs pendant start_period ne comptent pas contre
      # "retries" et ne marquent pas le conteneur unhealthy.
      start_period: 60m

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - CF_GRAPHHOPPER_URL=http://graphhopper:8989
      - CF_DATABASE_PATH=/data/circuit-forgery.db
    volumes:
      - ./backend/data:/data
    logging: *default-logging
    ports:
      # 0.0.0.0 côté conteneur + publication sur toutes les interfaces hôte :
      # c'est le seul service exposé au LAN (cf. Phase 7 du plan).
      - "8000:8000"
    depends_on:
      graphhopper:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Sonde de vivacité seule (/api/health/live, sans dépendance) : l'ancienne
      # sonde /api/health lançait un vrai calcul d'itinéraire GraphHopper toutes
      # les 30 s. L'état des dépendances reste consultable sur /api/health, et
      # /api/health/ready répond 503 tant qu'elles ne sont pas disponibles ; le
      # séquencement du démarrage est assuré par depends_on ci-dessus.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  graph-cache:
